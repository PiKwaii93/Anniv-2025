<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot Roulette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .shot-glow { text-shadow: 0 0 20px #ef4444; }
        .safe-glow { text-shadow: 0 0 20px #22c55e; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-10 shadow-2xl border border-slate-700 text-center space-y-10">
        <h1 class="text-4xl font-extrabold text-white">🎯 Shot Roulette</h1>
        
        <div id="result-container" class="h-32 flex items-center justify-center">
            <p id="result" class="text-2xl text-slate-400 font-medium">Tente ta chance...</p>
        </div>

        <button onclick="play()" id="play-btn" class="w-full py-5 bg-red-600 hover:bg-red-700 rounded-2xl font-bold text-2xl transition-all active:scale-95 shadow-lg shadow-red-900/40">
            TIRER !
        </button>

        <a href="index.html" class="block text-slate-500 hover:text-white transition">Retour à l'accueil</a>
    </div>

    <script>
        function play() {
            const res = document.getElementById('result');
            const btn = document.getElementById('play-btn');
            
            btn.disabled = true;
            res.innerText = "Ça tourne...";
            res.className = "text-3xl font-bold animate-pulse text-white";
            
            setTimeout(() => {
                const isShot = Math.floor(Math.random() * 6) === 0; // 1 chance sur 6
                if (isShot) {
                    res.innerText = "SHOT ! 🥃";
                    res.className = "text-5xl font-black text-red-500 shot-glow";
                } else {
                    res.innerText = "SAUVÉ 🍺";
                    res.className = "text-5xl font-black text-green-500 safe-glow";
                }
                btn.disabled = false;
            }, 800);
        }
    </script>
</body>
</html>
